<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro Parroquial Asunción de María</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: url('imagen/cielo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }

        .top-bar {
            background-color: rgba(0, 64, 128, 0.9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .top-bar img {
            height: 50px;
            margin-right: 15px;
        }

        .top-bar .title {
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
        }

        .top-bar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin-left: 20px;
        }

        .top-bar a:hover {
            text-decoration: underline;
        }

        .container {
            text-align: center;
            margin-top: 50px;
        }

        /* Estilo para las secciones de imágenes */
        .image-sections {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .image-section {
            width: 300px;
            height: 200px;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .image-section:hover {
            transform: scale(1.05);
        }

        .info-text {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #333;
            background-color: rgba(255, 255, 255, 0.8); /* Fondo con transparencia */
            padding: 15px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="title">
            <img src="imagen/logo_asun.png" alt="Logo Recinto">
            Centro Parroquial Asunción de María
        </div>
        <a href="index.html">Inicio</a>
    </div>

    <div class="container">
        <div class="image-sections" id="image-sections">
            <div class="image-section" style="background-image: url('imagen/salonArriba.jpg');" onclick="location.href='salonesarriba.html'"></div>
            <div class="image-section" style="background-image: url('imagen/salonPrincipal.jpg');" onclick="location.href='salonPrincipal.html'"></div>
            <div class="image-section" style="background-image: url('imagen/auditorio.jpg');" onclick="location.href='auditorio.html'"></div>
        </div>

        <div class="info-text" id="info-text">
            Explora nuestros salones y auditorios para tus próximos eventos. Haz clic en cualquiera de las imágenes para más información.
        </div>
    </div>

    <script>
        function changeImage() {
            let imgElement = document.getElementById("schedule-image");
            let sections = document.getElementById("image-sections");
            let infoText = document.getElementById("info-text");

            imgElement.style.display = "none";
            infoText.style.display = "none";
            sections.style.display = "flex";
        }
    </script>
</body>
</html>
