<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página en Construcción</title>
    <link rel="icon" type="image/png" href="/imagen/favicon.png?v=1.1">
    <style>
        /* Estilos generales */
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('imagen/cielo.jpg') no-repeat center center fixed;
            background-size: cover; /* La imagen cubre toda la pantalla */
            color: #333;
        }

        .construction-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh; /* Ocupa el 80% de la pantalla para dejar espacio para el logo */
            backdrop-filter: blur(5px); /* Difumina el fondo detrás del contenido */
        }

        .construction-container h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .construction-container img {
            max-width: 800px; /* Ajusta el tamaño máximo de la imagen */
            width: 100%; /* Se adapta a pantallas pequeñas */
            margin-top: 10px;
        }

        /* Estilos para el logo en la parte inferior */
        .logo-container {
            position: relative;
            text-align: center;
            padding: 20px;
        }

        .logo-container img {
            max-width: 150px; /* Tamaño del logo */
            width: 100%;
        }
    </style>
</head>
<body>
<div class="construction-container">
    <h1>🚧 Página en Construcción 🚧</h1>
    <p>Estamos trabajando para traerte toda la información de la misión. Vuelve pronto.</p>
    <img src="imagen/reconstruccion.png" alt="Imagen de construcción">
</div>

<!-- Logo en la parte inferior -->
<div class="logo-container">
    <img src="imagen/logo_asun.png" alt="Logo del Coro Asunción de María">
</div>
</body>
</html>
