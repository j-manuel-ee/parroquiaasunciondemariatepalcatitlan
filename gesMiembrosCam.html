<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Integrantes | Coro CAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Open Sans', sans-serif; background-color: #369bfa; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2, h3 { font-family: 'Playfair Display', serif; color: #0d47a1; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .btn { background-color: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-volver { background-color: #6c757d; text-decoration: none; display: inline-block; color: white; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #0d47a1; color: white; }
    .btn-eliminar { background-color: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/conexion.js"></script>
</head>
<body>
  <div class="container">
    <a href="cordiDashboard.html" class="btn-volver">← Volver al Dashboard</a>
    <h2>Gestión de Integrantes del Coro CAM</h2>
    <p>Agrega o elimina miembros oficiales del coro.</p>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    <h3>Agregar Nuevo Miembro</h3>
    <form id="addMiembroForm" onsubmit="agregarMiembro(event)">
      <div class="form-group">
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
      </div>
      <div class="form-group">
        <label for="codigo">Clave de Acceso:</label>
        <input type="text" id="codigo" placeholder="Ej. Cam.Juan26!" required>
      </div>
      <button type="submit" class="btn">Guardar Integrante</button>
    </form>
    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
    <h3>Integrantes Registrados</h3>
    <table>
      <thead>
        <tr>
          <th>Nombre Completo</th>
          <th>Clave de Acceso</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaMiembros">
        <tr><td colspan="3" style="text-align: center;">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", cargarMiembros);
    async function cargarMiembros() {
      const tbody = document.getElementById('tablaMiembros');
      const { data, error } = await supabaseClient.from('miembros_cam').select('*').order('nombre_completo', { ascending: true });
      if (error || !data) { tbody.innerHTML = '<tr><td colspan="3">Error al cargar.</td></tr>'; return; }
      tbody.innerHTML = data.length === 0 ? '<tr><td colspan="3">Sin registros.</td></tr>' : '';
      data.forEach(m => {
        tbody.innerHTML += `<tr><td>${m.nombre_completo}</td><td><code>${m.codigo_acceso}</code></td><td><button class="btn-eliminar" onclick="eliminarMiembro(${m.id})">Eliminar</button></td></tr>`;
      });
    }
    async function agregarMiembro(event) {
      event.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const codigo = document.getElementById('codigo').value.trim();
      const { error } = await supabaseClient.from('miembros_cam').insert([{ nombre_completo: nombre, codigo_acceso: codigo }]);
      if (error) { alert("Error al agregar: " + error.message); return; }
      alert("¡Agregado con éxito!");
      document.getElementById('addMiembroForm').reset();
      cargarMiembros();
    }
    async function eliminarMiembro(id) {
      if (!confirm("¿Deseas eliminar a este integrante?")) return;
      await supabaseClient.from('miembros_cam').delete().eq('id', id);
      cargarMiembros();
    }
  </script>
</body>
</html>
