<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio de Sesión del Coordinador</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('imagen/cielo.jpg') no-repeat center center fixed;
      background-size: cover;
      color: black;
      margin: 0;
      padding: 0;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.8);
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      width: 300px;
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-size: 1.5em;
      color: #333;
    }

    .login-box label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .login-box button:hover {
      background-color: #0056b3;
    }

    .error-message {
      color: red;
      margin: 10px 0;
      font-size: 0.9em;
      display: none;
    }
  </style>
  <script>
    const cuentas = {
        "1017123": "Adoracion01",
        "1017234": "Catequesis20",
        "1017345": "CofraDelCarmen33",
        "1017456": "CAMJENS30",
        "1017567": "EscuCha51",
        "1017678": "CoroSOS62",
        "1017789": "EnMatrimonial79",  
        "1017890": "EscPastoral88",
        "1017901": "EvaEscenicos92",
        "1017012" : "FBAM100", 
        "1017023" : "Scouts111",
        "1017034" : "HmnCristo121", 
        "1017045" : "MJVCKuhtli135",  
        "1017056" : "Liturgia2024",  
        "1017067" : "Meses743",  
        "1017078" : "Monaguillos532",  
        "1017089" : "MnO456vW",  
        "1017090" : "Platicas947",  
        "1017111" : "PasInfantil0487", 
        "1017222" : "PasScocial738", 
        "1017333" : "LmN753dE",
        "1017444" : "QrS852fG"
    };

    function validarLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMessage = document.getElementById('error-message');

      if (username === "" || password === "") {
        errorMessage.textContent = "Todos los campos son obligatorios.";
        errorMessage.style.display = "block";
        return;
      }

      if (cuentas[username] && cuentas[username] === password) {
        alert("Inicio de sesión exitoso");
        window.location.href = "cordiDashboard.html";
      } else {
        errorMessage.textContent = "Número de cuenta o contraseña incorrectos.";
        errorMessage.style.display = "block";
      }
    }
  </script>
</head>
<body>
<div class="login-container">
  <div class="login-box">
    <h2>Iniciar Sesión como Coordinador</h2>
    <form onsubmit="validarLogin(event)">
      <label for="username">Número de Cuenta:</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Iniciar Sesión</button>
    </form>
    <div id="error-message" class="error-message"></div>
  </div>
</div>
</body>
</html>
